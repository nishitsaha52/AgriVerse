[project]
name = "agriverse-api"
version = "0.1.0"
description = "Production API for AgriVerse"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aioboto3>=15.0.0",
  "alembic>=1.16.0",
  "arq>=0.26.3",
  "asyncpg>=0.30.0",
  "authlib>=1.6.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "openai>=1.99.0",
  "opentelemetry-distro>=0.57b0",
  "opentelemetry-exporter-otlp>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-httpx>=0.57b0",
  "opentelemetry-instrumentation-redis>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "phonenumbers>=9.0.0",
  "pgvector>=0.4.0",
  "pillow>=11.3.0",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.20",
  "redis>=5.0.0,<6",
  "sqlalchemy[asyncio]>=2.0.41",
  "structlog>=25.4.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
  "voyageai>=0.3.4"
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0",
  "mypy>=1.17.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agriverse"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = [
  "B008",  # FastAPI dependencies are intentionally declared as call defaults.
  "S101",
  "S105",  # OAuth/JWT token type labels are not credentials.
  "S106",
  "S110"   # Degraded optional providers intentionally fail closed or fall back.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires Postgres/pgvector, Redis, and MinIO",
]

[tool.coverage.run]
branch = true
source = ["agriverse"]
