name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy agriverse
      - run: uv run pytest --cov=agriverse --cov-report=term-missing --cov-fail-under=80
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --project apps/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run --project apps/api python apps/api/scripts/export_openapi.py
      - run: pnpm --filter @agriverse/api-client generate
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated/schema.d.ts

  infrastructure-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agriverse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agriverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agriverse
      REDIS_URL: redis://127.0.0.1:6379/0
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: agriverse-ci
      RUN_INFRA_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras --dev
      - name: Start MinIO
        working-directory: .
        run: >-
          docker run -d --name agriverse-minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          quay.io/minio/aistor/minio:latest server /data --address :9000
      - name: Wait for MinIO
        working-directory: .
        run: |
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs agriverse-minio
          exit 1
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration -m integration

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
