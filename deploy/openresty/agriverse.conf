upstream agriverse_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream agriverse_api {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 80;
    server_name agriverse.com www.agriverse.com;
    client_max_body_size 10m;

    location = /healthz {
        proxy_pass http://agriverse_api/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://agriverse_api/readyz;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://agriverse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        proxy_pass http://agriverse_api/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://agriverse_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
